[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurogut-metaseq"
version = "0.1.0"
description = "Cross-study RNA-seq meta-analysis of microglial transcriptomic signatures in response to microbiome depletion and microbial metabolites."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Samyak Meshram" },
    { name = "Dr. Soumya Dhokey" }
]
dependencies = [
    "pydeseq2>=0.4.8",
    "gseapy>=1.1.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "openpyxl>=3.1.2",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
