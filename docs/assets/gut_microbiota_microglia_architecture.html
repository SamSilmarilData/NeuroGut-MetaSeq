<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroGut-MetaSeq Architecture · Gut-Microbiota-Microglia Axis</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;   /* crisp alabaster slate */
      --color-paper-2: #f1f5f9;   /* container slate */
      --color-ink:     #0f172a;   /* midnight obsidian */
      --color-muted:   #475569;   /* mineral slate */
      --color-soft:    #64748b;   /* refined slate */
      --color-accent:  #b91c1c;   /* signal crimson */
      --color-link:    #1d4ed8;   /* lapis cobalt */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1040px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.05rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Mechanistic Architecture · NeuroGut-MetaSeq</p>
    <h1>The Gut-Microbiota-Microglia Axis &amp; Cerebrovascular Relay</h1>
    <p class="subtitle">Cell-intrinsic tonic interferon surveillance shutoff, nutrient-sensing adaptation, and chromatin reversibility</p>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="neurogut-arch-title neurogut-arch-desc">
        <title id="neurogut-arch-title">Mechanistic Architecture of the Gut-Microbiota-Microglia Axis</title>
        <desc id="neurogut-arch-desc">Schematic showing bacterial OMVs and SCFAs signaling across the blood-brain barrier and border macrophages to calibrate microglial tonic interferon tone, Llgl2-LAT1 scavenging, and epigenetic chromatin footprints.</desc>
        
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#b91c1c"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/>
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect width="960" height="600" fill="#f8fafc"/>

        <!-- ==================== TISSUE COMPARTMENT ZONES ==================== -->
        <!-- Zone 1: Gut Lumen -->
        <rect x="32" y="48" width="260" height="452" rx="8" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
        <rect x="52" y="52" width="168" height="14" rx="2" fill="#f8fafc"/>
        <text x="136" y="63" fill="#64748b" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="500" text-anchor="middle" letter-spacing="0.18em">GUT LUMEN &amp; MUCOSA</text>

        <!-- Zone 2: BBB & Vasculature -->
        <rect x="320" y="48" width="296" height="452" rx="8" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
        <rect x="340" y="52" width="216" height="14" rx="2" fill="#f8fafc"/>
        <text x="448" y="63" fill="#64748b" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="500" text-anchor="middle" letter-spacing="0.18em">CEREBROVASCULAR RELAY (BBB)</text>

        <!-- Zone 3: Brain Parenchyma -->
        <rect x="644" y="48" width="284" height="452" rx="8" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
        <rect x="664" y="52" width="224" height="14" rx="2" fill="#f8fafc"/>
        <text x="776" y="63" fill="#64748b" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="500" text-anchor="middle" letter-spacing="0.18em">CNS PARENCHYMA &amp; MICROGLIA</text>

        <!-- ==================== CONNECTORS & PATHWAYS ==================== -->
        <!-- 1. Microbiota -> Circulation (Horizontal) -->
        <line x1="272" y1="148" x2="332" y2="148" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="282" y="141" width="40" height="14" rx="2" fill="#f8fafc"/>
        <text x="302" y="151" fill="#475569" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" text-anchor="middle">FLUX</text>

        <!-- 2. Microbiota -> Vagus Nerve (Vertical) -->
        <line x1="162" y1="216" x2="162" y2="292" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="136" y="249" width="52" height="14" rx="2" fill="#f8fafc"/>
        <text x="162" y="259" fill="#475569" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" text-anchor="middle">AFFERENT</text>

        <!-- 3. Circulation -> BMEC (Vertical) -->
        <line x1="468" y1="208" x2="468" y2="232" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="444" y="214" width="48" height="14" rx="2" fill="#f8fafc"/>
        <text x="468" y="224" fill="#475569" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" text-anchor="middle">TLR4-LPS</text>

        <!-- 4. Circulation -> Microglial Tonic Tone (Horizontal, Accent) -->
        <line x1="596" y1="148" x2="656" y2="148" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="606" y="141" width="40" height="14" rx="2" fill="#f8fafc"/>
        <text x="626" y="151" fill="#b91c1c" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">TONIC</text>

        <!-- 5. BMEC -> Microglial Tonic Tone (Right-Up Elbow, Link Blue) -->
        <path d="M 596,280 H 622 Q 630,280 630,272 V 188 Q 630,180 638,180 H 656" fill="none" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="604" y="222" width="52" height="14" rx="2" fill="#f8fafc"/>
        <text x="630" y="232" fill="#1d4ed8" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">IFNB1</text>

        <!-- 6. BMEC -> BAM (Vertical) -->
        <line x1="468" y1="344" x2="468" y2="368" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="438" y="350" width="60" height="14" rx="2" fill="#f8fafc"/>
        <text x="468" y="360" fill="#475569" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" text-anchor="middle">PARAVASC</text>

        <!-- 7. BAM -> Chromatin Footprints (Horizontal) -->
        <line x1="596" y1="424" x2="656" y2="424" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="602" y="417" width="48" height="14" rx="2" fill="#f8fafc"/>
        <text x="626" y="427" fill="#475569" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" text-anchor="middle">RESCUE</text>

        <!-- 8. Tonic Tone -> Llgl2-LAT1 (Vertical, Accent) -->
        <line x1="786" y1="212" x2="786" y2="232" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="758" y="216" width="56" height="14" rx="2" fill="#f8fafc"/>
        <text x="786" y="226" fill="#b91c1c" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">COUPLING</text>

        <!-- 9. Llgl2-LAT1 -> Chromatin Footprints (Vertical) -->
        <line x1="786" y1="352" x2="786" y2="368" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="760" y="354" width="52" height="14" rx="2" fill="#f8fafc"/>
        <text x="786" y="364" fill="#475569" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" text-anchor="middle">METABOLIC</text>

        <!-- ==================== BIOLOGICAL NODES ==================== -->
        <!-- Node 1: Commensal Microbiota (Input) -->
        <g id="node-microbiota">
          <rect x="52" y="104" width="220" height="112" rx="6" fill="rgba(71,85,105,0.08)" stroke="#64748b" stroke-width="1"/>
          <rect x="64" y="114" width="76" height="14" rx="2" fill="rgba(15,23,42,0.06)"/>
          <text x="102" y="124" fill="#475569" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" text-anchor="middle" letter-spacing="0.1em">DISTAL COLON</text>
          <text x="64" y="146" fill="#0f172a" font-family="'Geist', sans-serif" font-size="12" font-weight="600">Commensal Microbiota</text>
          <text x="64" y="165" fill="#475569" font-family="'Geist Mono', monospace" font-size="9">• Clostridia · Bacteroidetes</text>
          <text x="64" y="180" fill="#475569" font-family="'Geist Mono', monospace" font-size="9">• SCFA Synthesis (Ac/Pr/Bu)</text>
          <text x="64" y="195" fill="#475569" font-family="'Geist Mono', monospace" font-size="9">• OMV Secretion (LPS/PAMPs)</text>
        </g>

        <!-- Node 2: Vagus Nerve (Backend) -->
        <g id="node-vagus">
          <rect x="52" y="300" width="220" height="100" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <rect x="64" y="310" width="88" height="14" rx="2" fill="rgba(15,23,42,0.06)"/>
          <text x="108" y="320" fill="#475569" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" text-anchor="middle" letter-spacing="0.1em">PILLAR 3 · NEURAL</text>
          <text x="64" y="342" fill="#0f172a" font-family="'Geist', sans-serif" font-size="12" font-weight="600">Vagus Nerve Afferents</text>
          <text x="64" y="361" fill="#64748b" font-family="'Geist Mono', monospace" font-size="9">• Subdiaphragmatic Cues</text>
          <text x="64" y="376" fill="#64748b" font-family="'Geist Mono', monospace" font-size="9">• Nucleus Tractus Solitarius</text>
        </g>

        <!-- Node 3: Circulation (Store) -->
        <g id="node-circulation">
          <rect x="340" y="104" width="256" height="104" rx="6" fill="rgba(15,23,42,0.04)" stroke="#475569" stroke-width="1"/>
          <rect x="352" y="114" width="80" height="14" rx="2" fill="rgba(15,23,42,0.06)"/>
          <text x="392" y="124" fill="#475569" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" text-anchor="middle" letter-spacing="0.1em">VASCULAR BED</text>
          <text x="352" y="146" fill="#0f172a" font-family="'Geist', sans-serif" font-size="12" font-weight="600">Circulating OMVs &amp; SCFAs</text>
          <text x="352" y="165" fill="#475569" font-family="'Geist Mono', monospace" font-size="9">• Bacterial OMVs (TLR4/CD14)</text>
          <text x="352" y="180" fill="#475569" font-family="'Geist Mono', monospace" font-size="9">• Acetate Systemic Conc (0.1 mM)</text>
        </g>

        <!-- Node 4: BMEC Endothelium (Backend) -->
        <g id="node-bmec">
          <rect x="340" y="240" width="256" height="104" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <rect x="352" y="250" width="76" height="14" rx="2" fill="rgba(29,78,216,0.10)"/>
          <text x="390" y="260" fill="#1d4ed8" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" text-anchor="middle" letter-spacing="0.1em">ENDOTHELIUM</text>
          <text x="352" y="282" fill="#0f172a" font-family="'Geist', sans-serif" font-size="12" font-weight="600">BMEC Cerebrovascular Relay</text>
          <text x="352" y="301" fill="#475569" font-family="'Geist Mono', monospace" font-size="9">• Ifnb1 Transduction (r = 0.600)</text>
          <text x="352" y="316" fill="#475569" font-family="'Geist Mono', monospace" font-size="9">• Tight Junctions (Tjp1, Cldn5)</text>
        </g>

        <!-- Node 5: Perivascular BAMs (Backend) -->
        <g id="node-bam">
          <rect x="340" y="376" width="256" height="96" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <rect x="352" y="386" width="94" height="14" rx="2" fill="rgba(15,23,42,0.06)"/>
          <text x="399" y="396" fill="#475569" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" text-anchor="middle" letter-spacing="0.1em">PILLAR 1 · MYELOID</text>
          <text x="352" y="418" fill="#0f172a" font-family="'Geist', sans-serif" font-size="12" font-weight="600">Border Macrophages (BAM)</text>
          <text x="352" y="437" fill="#64748b" font-family="'Geist Mono', monospace" font-size="9">• Perivascular Sentinel Barrier</text>
          <text x="352" y="452" fill="#64748b" font-family="'Geist Mono', monospace" font-size="9">• Direct SCFA Sensory Interface</text>
        </g>

        <!-- Node 6: FOCAL ACCENT 1 - Tonic Interferon Shutoff -->
        <g id="node-interferon">
          <rect x="664" y="92" width="244" height="120" rx="6" fill="rgba(185,28,28,0.08)" stroke="#b91c1c" stroke-width="1.2"/>
          <rect x="676" y="102" width="104" height="14" rx="2" fill="#b91c1c"/>
          <text x="728" y="112" fill="#ffffff" font-family="'Geist Mono', monospace" font-size="7" font-weight="700" text-anchor="middle" letter-spacing="0.1em">MASTER REGULON</text>
          <text x="676" y="136" fill="#b91c1c" font-family="'Geist', sans-serif" font-size="12" font-weight="600">Tonic Interferon Shutoff</text>
          <text x="676" y="155" fill="#0f172a" font-family="'Geist Mono', monospace" font-size="9">• Irf1 / Stat1 Collapse (Z = -2.28)</text>
          <text x="676" y="170" fill="#0f172a" font-family="'Geist Mono', monospace" font-size="9">• Cell-Intrinsic (BayesPrism p&lt;0.001)</text>
          <text x="676" y="185" fill="#0f172a" font-family="'Geist Mono', monospace" font-size="9">• Sex-Invariant Core (99.1%, I²=0%)</text>
        </g>

        <!-- Node 7: FOCAL ACCENT 2 - Llgl2-LAT1 Nutrient Axis -->
        <g id="node-llgl2">
          <rect x="664" y="240" width="244" height="112" rx="6" fill="rgba(185,28,28,0.08)" stroke="#b91c1c" stroke-width="1.2"/>
          <rect x="676" y="250" width="112" height="14" rx="2" fill="#b91c1c"/>
          <text x="732" y="260" fill="#ffffff" font-family="'Geist Mono', monospace" font-size="7" font-weight="700" text-anchor="middle" letter-spacing="0.1em">METABOLIC ADAPTER</text>
          <text x="676" y="284" fill="#b91c1c" font-family="'Geist', sans-serif" font-size="12" font-weight="600">Llgl2-LAT1 Nutrient Axis</text>
          <text x="676" y="303" fill="#0f172a" font-family="'Geist Mono', monospace" font-size="9">• Llgl2 Polarity (+0.290 LFC, k=4)</text>
          <text x="676" y="318" fill="#0f172a" font-family="'Geist Mono', monospace" font-size="9">• Slc7a5 LAT1 Scavenging (r = 0.61)</text>
          <text x="676" y="333" fill="#0f172a" font-family="'Geist Mono', monospace" font-size="9">• mTOR Repression (-0.469 LFC)</text>
        </g>

        <!-- Node 8: Epigenetic Footprinting (Backend) -->
        <g id="node-epigenetics">
          <rect x="664" y="376" width="244" height="96" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <rect x="676" y="386" width="96" height="14" rx="2" fill="rgba(21,128,61,0.12)"/>
          <text x="724" y="396" fill="#15803d" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" text-anchor="middle" letter-spacing="0.1em">EPIGENETIC STATUS</text>
          <text x="676" y="418" fill="#0f172a" font-family="'Geist', sans-serif" font-size="12" font-weight="600">ATAC Chromatin Footprints</text>
          <text x="676" y="437" fill="#475569" font-family="'Geist Mono', monospace" font-size="9">• 88.9% Irf1 Footprint Restoration</text>
          <text x="676" y="452" fill="#475569" font-family="'Geist Mono', monospace" font-size="9">• Chromatin-Poised Reversibility</text>
        </g>

        <!-- ==================== HORIZONTAL BOTTOM LEGEND STRIP ==================== -->
        <g id="legend-strip" transform="translate(32, 532)">
          <rect x="0" y="0" width="896" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
          
          <!-- Legend Item 1: Focal Node -->
          <rect x="24" y="14" width="12" height="12" rx="2" fill="rgba(185,28,28,0.15)" stroke="#b91c1c" stroke-width="1.2"/>
          <text x="44" y="24" fill="#0f172a" font-family="'Geist', sans-serif" font-size="10" font-weight="500">Key Mechanistic Finding (Focal)</text>

          <!-- Legend Item 2: Endothelial / Vascular Relay -->
          <line x1="240" y1="20" x2="260" y2="20" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-link)"/>
          <text x="270" y="24" fill="#0f172a" font-family="'Geist', sans-serif" font-size="10" font-weight="500">Vascular Relay (Link)</text>

          <!-- Legend Item 3: Standard Processing Unit -->
          <rect x="420" y="14" width="12" height="12" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <text x="440" y="24" fill="#0f172a" font-family="'Geist', sans-serif" font-size="10" font-weight="500">Cellular / Tissue Sentinel</text>

          <!-- Legend Item 4: Upstream Flux / Input -->
          <rect x="600" y="14" width="12" height="12" rx="2" fill="rgba(71,85,105,0.08)" stroke="#64748b" stroke-width="1"/>
          <text x="620" y="24" fill="#0f172a" font-family="'Geist', sans-serif" font-size="10" font-weight="500">Upstream Biological Influx</text>

          <!-- Legend Item 5: Epigenetic Restoration -->
          <rect x="768" y="14" width="12" height="12" rx="2" fill="rgba(21,128,61,0.12)" stroke="#15803d" stroke-width="1"/>
          <text x="788" y="24" fill="#0f172a" font-family="'Geist', sans-serif" font-size="10" font-weight="500">SCFA Reversal</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
