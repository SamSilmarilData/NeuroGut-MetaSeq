name: Reproducibility CI & Paper Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Execute Demo Pipeline End-to-End
        run: |
          python scripts/02_curate_metadata.py --demo
          python scripts/03b_pydeseq2_analysis.py --demo
          python scripts/04_meta_analysis.py --demo
          python scripts/05_pathway_enrichment.py --demo
          python scripts/06_generate_figures.py --demo

      - name: Restore Production Results & Build Web Paper
        run: |
          git checkout -- results/ data/metadata/
          python scripts/07_build_web_paper.py
          test -f docs/index.html || exit 1
          echo "Web paper built successfully!"

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
